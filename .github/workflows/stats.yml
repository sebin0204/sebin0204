name: Update GitHub stats cards

on:
  schedule:
    - cron: "17 15 * * *"   # 매일 00:17 (KST)
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["scripts/stats.py", ".github/workflows/stats.yml"]

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Generate cards
        run: python scripts/stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets
          git diff --cached --quiet || git commit -m "chore: 통계 카드 갱신"
          git push
